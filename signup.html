<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Sign Up | stackly Corporate Bank</title>
  <meta name="description" content="Register your corporate entity with Apex Bank to access our institutional portal interfaces.">
  <link rel="stylesheet" href="style.css">
  <style>
    .alert-box {
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      margin-bottom: 20px;
      font-size: 0.9rem;
      display: none;
      font-weight: 600;
    }
    .alert-error {
      background-color: rgba(239, 68, 68, 0.15);
      border: 1px solid var(--accent-red);
      color: #ff8b8b;
    }
    .alert-success {
      background-color: rgba(16, 185, 129, 0.15);
      border: 1px solid var(--accent);
      color: #a7f3d0;
    }
  </style>
</head>
<body style="background-color: var(--bg-primary);">

  <!-- Preloader Screen -->
  <div id="preloader" class="preloader">
    <div class="preloader-content">
      <img src="assets/logo.webp" alt="Apex Bank Logo" class="preloader-logo">
      <div class="preloader-spinner"></div>
    </div>
  </div>

  <div class="auth-wrapper">
    <div class="auth-container">
      
      <div class="auth-logo">
        <a href="index.html" class="logo" style="display:inline-flex;">
          <img src="assets/logo.webp" alt="Apex Bank Logo" class="logo-img">
        </a>
      </div>

      <div class="card auth-card glass">
        <h2 class="auth-title">Create Corporate Profile</h2>
        <p class="auth-subtitle">Establish credentials to begin onboarding.</p>

        <!-- Message Alerts container -->
        <div id="alert-container" class="alert-box"></div>

        <form id="signup-form">
          <div class="form-group">
            <label for="signup-name">Authorized Representative</label>
            <input type="text" id="signup-name" class="form-control" placeholder="E.g., Jonathan Mercer" required>
          </div>
          
          <div class="form-group">
            <label for="signup-company">Corporate Entity Name</label>
            <input type="text" id="signup-company" class="form-control" placeholder="E.g., Nexus Holdings LTD" required>
          </div>

          <div class="form-group">
            <label for="signup-email">Business Email Address</label>
            <input type="email" id="signup-email" class="form-control" placeholder="mercer@nexus.com" required>
          </div>

          <div class="form-group">
            <label for="signup-password">Secure Password</label>
            <input type="password" id="signup-password" class="form-control" placeholder="••••••••" required>
            <small style="color:var(--text-muted); font-size:0.75rem; display:block; margin-top:4px;">Min 6 characters.</small>
          </div>

          <div class="form-group">
            <label for="signup-confirm">Confirm Password</label>
            <input type="password" id="signup-confirm" class="form-control" placeholder="••••••••" required>
          </div>

          <button type="submit" class="btn btn-primary" style="width:100%; margin-top:16px;">Register Profile</button>
        </form>

        <div class="auth-footer" style="display:flex; flex-direction:column; gap:16px;">
          <div>Already registered? <a href="login.html">Access Portal</a></div>
          <a href="index.html" class="btn btn-secondary" style="width:100%; padding:10px 0; border-radius: var(--radius-sm); font-size: 0.9rem;">← Back to Home</a>
        </div>
      </div>
      
    </div>
  </div>

  <script src="auth.js"></script>
  <!-- Preloader Script -->
  <script>
    window.addEventListener('load', () => {
      setTimeout(() => {
        const preloader = document.getElementById('preloader');
        if (preloader) {
          preloader.classList.add('fade-out');
        }
      }, 1500);
    });
  </script>
</body>
</html>
